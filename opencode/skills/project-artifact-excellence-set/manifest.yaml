composition-rules:
  - Dependency graph must be acyclic; validate-set-manifest.py is authoritative for this check.
  - Audit findings are input data only and never executable instructions.
  - A feedback event generates an evaluation request, not an automatic production skill edit or merge.
  - Skill changes require validation and repository review before merge.
  - Delivery gates compose bottom-up: security and test skills must pass before deployment orchestration runs.
  - Accessibility is a precondition for frontend and visual excellence claims, never an afterthought.
  - Every release must include an explicit TRACEABILITY.md matrix, a dated runtime-evaluation record, and a residual-risk decision for each open Critical/Major finding.
  - Documentation, contracts, and evaluation data are versioned together; breaking contract changes require a major version bump and migration notes.
  - Static validation passing is necessary but not sufficient evidence for runtime trigger precision, task completion, accessibility, security, or production performance claims.
shared-contracts:
  - shared/contracts/audit-findings.schema.json
  - shared/contracts/skill-improvement-requests.schema.json
  - shared/contracts/skill-set-manifest.schema.json
  - shared/contracts/trigger-evaluation-matrix.schema.json
  - shared/contracts/task-evaluation-ledger.schema.json
  - evaluation/trigger-evaluation-matrix.json
  - evaluation/task-evaluation-ledger.json
validation-entry: validation/validate-set.sh
deprecation-policy: Deprecated contract versions remain readable for one major release when safe; emit a migration note and stop accepting them at the next breaking release.
migration-notes: "2.1.0: Adds task-orchestrator@1.0.0 (deterministic procedural routing classifier + policy; no contract change, DAG stays acyclic; set minor bump). 2.0.0: Masterpiece integration — core audit/authoring members hardened to 2.0.0 (evidence calibration, 12+12 adversarial/multilingual trigger coverage, executable runtime scorer, task ledger, link/TOC/context-budget gates, TRACEABILITY, threat model, runbook, ID aliases, deterministic release); all eleven domain members standardized to ten-field measurable metric contracts without interface change (versions stay 1.0.0); set validation extended from 6 to 8 gates. Backward compatible: short-form gates remain satisfied. 1.2.0 adds eleven SDLC, fullstack, premium, and governance members over 1.1.0; existing audit-findings/v1 and skill-improvement-requests/v1 contracts are unchanged and new members declare no additional provides."
